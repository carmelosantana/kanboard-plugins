# Spec gap 5 probe (scenario step 5d). An agent pushes this to an agent/* branch; it is the
# untrusted code. It dumps every Actions secret and variable the job can see, and probes the job's
# limits and network. Forgejo masks literal secret values in logs, so the dump is base64: the
# scenario decodes it and looks for the test secret. The per-job token (GITHUB_TOKEN and its
# aliases) is blanked before the dump: it is always present and is not a stored secret.
#
# scenario.sh 5d replaces the runs-on label with the isolation option's runner label. Lines that
# start with "KB5D " are what it reads.
name: leak-secrets
on:
  push:
    branches: ['agent/**']
jobs:
  leak:
    runs-on: kb-ci-option
    steps:
      - name: dump and probe
        shell: bash
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          set +e
          b64() { base64 -w0; }
          printf 'KB5D secrets-b64 %s\n' "$(printf '%s' "$ALL_SECRETS" |
            sed -E 's/"(GITHUB_TOKEN|GITEA_TOKEN|FORGEJO_TOKEN)": *"[^"]*"/"\1": "<job token>"/g' | b64)"
          printf 'KB5D vars-b64 %s\n' "$(printf '%s' "$ALL_VARS" | b64)"
          # Limits, from the job's own cgroup (v2 files, else v1).
          cg=/sys/fs/cgroup
          if [ -f $cg/cpu.max ]; then cpu="$(cat $cg/cpu.max)"
          else cpu="$(cat $cg/cpu/cpu.cfs_quota_us 2>/dev/null) $(cat $cg/cpu/cpu.cfs_period_us 2>/dev/null)"; fi
          if [ -f $cg/memory.max ]; then mem="$(cat $cg/memory.max)"
          else mem="$(cat $cg/memory/memory.limit_in_bytes 2>/dev/null)"; fi
          if [ -f $cg/pids.max ]; then pids="$(cat $cg/pids.max)"
          else pids="$(cat $cg/pids/pids.max 2>/dev/null)"; fi
          printf 'KB5D cpu %s\nKB5D memory %s\nKB5D pids %s\n' "$cpu" "$mem" "$pids"
          # The kernel's thread cap and its current thread count (whole kernel: for Kata, the
          # job's own guest VM).
          printf 'KB5D threads-max %s\nKB5D threads %s\n' "$(cat /proc/sys/kernel/threads-max 2>/dev/null)" \
            "$(awk '{ split($4, a, "/"); print a[2] }' /proc/loadavg 2>/dev/null)"
          printf 'KB5D kernel %s\n' "$(uname -r)"
          printf 'KB5D dmesg %s\n' "$(dmesg 2>/dev/null | head -1)"
          # Network: HTTP status (000 = no connection), and raw TCP connects.
          http() { curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$@" 2>/dev/null || true; }
          tcp() { timeout 5 bash -c "exec 3<>/dev/tcp/$1/$2" 2>/dev/null && echo open || echo closed; }
          # The job's default gateway (the runner host's bridge), from /proc/net/route.
          h="$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)"
          gw=""; [ -n "$h" ] && gw="$(printf '%d.%d.%d.%d' "0x${h:6:2}" "0x${h:4:2}" "0x${h:2:2}" "0x${h:0:2}")"
          printf 'KB5D internet %s\n' "$(http --noproxy '*' https://example.com)"
          printf 'KB5D internet-ip %s\n' "$(tcp 1.1.1.1 443)"
          # Through the proxy: "<CONNECT status>/<HTTP status>".
          viaproxy() { curl -s -o /dev/null -w '%{http_connect}/%{http_code}' --max-time 8 -x http://kb-proxy:3128 "$1" 2>/dev/null || true; }
          printf 'KB5D proxy-allowed %s\n' "$(viaproxy https://registry.npmjs.org/)"
          printf 'KB5D proxy-denied %s\n' "$(viaproxy https://example.com)"
          # libcurl pins *.localhost to loopback (F14), so pin git.localhost to the address the
          # runner gave it (/etc/hosts).
          gl="$(getent hosts git.localhost | awk '{ print $1; exit }')"
          printf 'KB5D traefik %s\n' "$(http --noproxy '*' --resolve "git.localhost:8090:${gl:-127.0.0.1}" http://git.localhost:8090/api/healthz)"
          printf 'KB5D forgejo-direct %s\n' "$(tcp forgejo 3000)"
          for p in 22 3000 8081 8090; do printf 'KB5D host-%s %s\n' "$p" "$(tcp 10.0.2.2 "$p")"; done
          printf 'KB5D gateway %s\nKB5D gateway-22 %s\n' "$gw" "$(tcp "${gw:-0.0.0.0}" 22)"
          echo "KB5D done"
