# forgejo-runner config template for option (b), PARKED (see up.sh). up.sh would fill in the uuid;
# the token comes from a systemd user credential, never this file.
log:
  level: info
  job_level: info
runner:
  capacity: 1
  # Spec: wall time 30 min per job.
  timeout: 30m
  fetch_interval: 2s
  report_interval: 1s
  # Package managers in jobs go through the allowlist proxy; Traefik is reached directly.
  envs:
    HTTP_PROXY: http://kb-proxy:3128
    HTTPS_PROXY: http://kb-proxy:3128
    http_proxy: http://kb-proxy:3128
    https_proxy: http://kb-proxy:3128
    NO_PROXY: git.localhost
    no_proxy: git.localhost
cache:
  enabled: false
container:
  # Jobs join kb-ci-jobs, an internal network of the rootless daemon (no route out) whose only
  # other member is the gateway container: socat to Traefik and the allowlist proxy, also on an
  # egress network. Spec limits: CPU 2, memory 4 GB (no swap on top), pids 1024.
  network: kb-ci-jobs
  privileged: false
  options: >-
    --cpus 2 --memory 4g --memory-swap 4g --pids-limit 1024
    --add-host git.localhost:172.31.255.2 --add-host kb-proxy:172.31.255.2
  valid_volumes: []
  # No Docker socket in job containers.
  docker_host: "-"
  force_pull: false
server:
  connections:
    forgejo:
      url: http://git.localhost:8090
      uuid: @@UUID@@
      token_url: file:$CREDENTIALS_DIRECTORY/kb-runner-secret
      labels: ["rootless-gvisor:docker://kb-ci-job:1"]
