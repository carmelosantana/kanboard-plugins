# tinyproxy for CI jobs: default deny, a host allowlist, HTTPS by CONNECT to 443 only.
Port 3128
Listen 0.0.0.0
Timeout 60
MaxClients 64
LogLevel Info
DisableViaHeader Yes
# The allowlist holds extended regexes matched against the host name only (FilterURLs off).
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
ConnectPort 443
