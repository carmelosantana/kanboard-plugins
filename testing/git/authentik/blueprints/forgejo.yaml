# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Authentik blueprint (git hosting P1 overlay): the OIDC provider and application for
# Forgejo's auth source `authentik` (OpenID Connect, discovery at
# http://auth.kb.test:8090/application/o/forgejo/.well-known/openid-configuration). Forgejo logs
# a returning user in by (source, login_name = sub); the broker pre-provisions that user.
#
# Mounted at /blueprints/custom; bootstrap.sh applies it through the API after every start.
# The client secret comes from testing/git/authentik.env (gitignored, written by bootstrap.sh).
# sub_mode hashed_user_id is the same for both providers, so Kanboard and Forgejo see one sub.
version: 1
metadata:
  name: kb-git forgejo OIDC
  labels:
    blueprints.goauthentik.io/description: Forgejo signs humans in through Authentik (git hosting P1)
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: forgejo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Authentik 2026.8 allows only the listed grants (an empty list allows none).
      grant_types: [authorization_code]
      client_id: forgejo
      client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: http://git.localhost:8090/user/oauth2/authentik/callback
          redirect_uri_type: authorization
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf provider
      meta_launch_url: http://git.localhost:8090/user/oauth2/authentik
      policy_engine_mode: any
