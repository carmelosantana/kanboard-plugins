# Git hosting P1 overlay: Forgejo 15 LTS (Postgres) behind Traefik, whose ForwardAuth asks the
# kanboard-git-broker about every repo request. Dev only; see testing/README.md "Git overlay".
#
# kb-suite is shared: start only these services, with the same compose set kb-suite runs with,
# so Kanboard is never recreated. testing/git/compose.sh holds that file list:
#   bash testing/git/compose.sh up -d --no-deps --build forgejo-db forgejo broker traefik
#
# Only Traefik publishes a host port (127.0.0.1:8090). It also listens on :8090 inside the
# network and carries the alias git.localhost, so http://git.localhost:8090/ is one URL for the
# host and containers (libcurl pins *.localhost to loopback; see testing/README.md).
#
# Images are pinned by tag and digest; bump both together.
#
# Authentik (identity for humans, Task 13) sits behind the same Traefik as auth.kb.test:8090, a
# second network alias. Not *.localhost: the OIDC issuer must be one URL for the browser, Forgejo
# and Kanboard's PHP curl back-channel, and libcurl pins *.localhost to loopback. The host reaches
# it with curl --resolve, or one optional /etc/hosts line (testing/README.md "Identity").
# Its secrets are in testing/git/authentik.env (gitignored, written by bootstrap.sh).
#
# The two HMAC secrets of the broker <-> GitHost channel (one per direction) live in testing/git/hmac.env
# (gitignored, written by bootstrap.sh). kb-suite loads only that file, never git/.env, which holds
# the Forgejo admin token. Adding GitHost or the env to kb-suite recreates it once:
#   bash testing/git/compose.sh up -d kanboard broker
services:
  # kb-suite: mount GitHost and point it at the broker. Its data is in kanboard-suite_kb-suite-data.
  kanboard:
    env_file:
      - path: ./git/hmac.env
        required: false
    environment:
      GITHOST_BROKER_URL: http://broker:8080
    volumes:
      - ../GitHost:/var/www/app/plugins/GitHost
      # Third-party OAuth2 plugin (Authentik login), pinned and hash-checked by
      # testing/git/fetch-oauth2.sh. Outside the repo root, so run-plugin-tests.sh never finds it.
      - ./git/vendor/OAuth2:/var/www/app/plugins/OAuth2:ro
      # php-fpm hands PHP only whitelisted env vars; this whitelist adds the two GitHost ones.
      - ./git/php-fpm-env.conf:/etc/php84/php-fpm.d/env.conf:ro

  forgejo-db:
    image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    container_name: kb-git-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: forgejo-dev-only
    volumes:
      - kb-git-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 5s
      timeout: 3s
      retries: 20

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.11-rootless@sha256:3cd6bc2b74c87cbde0a0fd527c9665cb416f5a0540dee54fe5afb3fa2df9f40c
    container_name: kb-git-forgejo
    restart: unless-stopped
    depends_on:
      forgejo-db:
        condition: service_healthy
    volumes:
      - ./git/forgejo/app.ini.tmpl:/etc/templates/app.ini:ro
      - ./git/forgejo/receive.gitconfig:/etc/forgejo/receive.gitconfig:ro
      - kb-git-forgejo-data:/var/lib/gitea
    # No ports: Forgejo is reachable only through Traefik.

  broker:
    build:
      context: ../../kanboard-git-broker
      # Dev stack only (ruling F9): the cargo feature behind BROKER_FAULT_SYNC_ONCE.
      args:
        CARGO_FEATURES: fault-injection
    image: kanboard-git-broker:dev
    container_name: kb-git-broker
    restart: unless-stopped
    env_file:
      - path: ./git/.env
        required: false
      - path: ./git/hmac.env
        required: false
    environment:
      # Pulls githost/state (HMAC-signed) every BROKER_RECONCILE_SECS (default 30).
      KANBOARD_URL: http://kb-suite
      # Empty normally. Scenario step 9 recreates the broker with 1: the next nudge sync fails
      # once (500) and the reconcile loop must repair the drift.
      BROKER_FAULT_SYNC_ONCE: ${BROKER_FAULT_SYNC_ONCE:-}
    volumes:
      # SQLite store (principals, tokens) and the JSONL audit log.
      - kb-git-broker-data:/var/lib/broker

  # Broker integration tests against http://forgejo:3000 on this network (Forgejo has no host
  # port). Profile `it` keeps it out of `up`; run it with:
  #   bash testing/git/compose.sh --profile it run --rm broker-it
  # Same toolchain image as the broker Dockerfile's builder. The broker checkout is mounted
  # read-only; the cargo registry and target dir live in named volumes.
  broker-it:
    image: rust:1.97.1-slim-trixie@sha256:8e8cf8f7fd54a2d23d5a743b3a03f56e26b6c774276c33fa0595111704ebb15c
    profiles: ["it"]
    working_dir: /src
    environment:
      CARGO_TARGET_DIR: /cargo-target
    env_file:
      - path: ./git/.env
        required: true
    volumes:
      - ../../kanboard-git-broker:/src:ro
      - kb-git-broker-it-registry:/usr/local/cargo/registry
      - kb-git-broker-it-target:/cargo-target
    # git (pinned trixie version, same as the broker image) for the risk gate's net diffs.
    command:
      - bash
      - -c
      - >-
        apt-get update -qq && apt-get install -y -qq --no-install-recommends git=1:2.47.3-0+deb13u1 >/dev/null
        && exec cargo test --locked --test forgejo_it -- --ignored

  traefik:
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: kb-git-traefik
    restart: unless-stopped
    depends_on:
      - forgejo
      - broker
    command:
      - --entrypoints.web.address=:8090
      # Reject encoded path characters (400) so a request cannot look like one route to the
      # router matchers and another to Forgejo, e.g. /org%2Frepo.git/info/refs.
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.web.http.encodedcharacters.allowencodedsemicolon=false
      - --entrypoints.web.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.web.http.encodedcharacters.allowencodedquestionmark=false
      - --entrypoints.web.http.encodedcharacters.allowencodedhash=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --accesslog=true
      - --log.level=INFO
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "127.0.0.1:8090:8090"
    # Mount the directory, not the file: an in-place edit then reaches the file watcher.
    volumes:
      - ./git/traefik:/etc/traefik:ro
    networks:
      default:
        aliases:
          - git.localhost
          - auth.kb.test
      # The CI network: the dev runner reaches Forgejo only through here (ForwardAuth applies).
      ci:
        aliases:
          - git.localhost

  # Dev-only CI runner (ruling F12): forgejo-runner one-job in host mode, label dev-plain, for
  # testing/git/fixtures/ci.yml. Profile ci-dev keeps it out of a plain `up`:
  #   bash testing/git/bootstrap.sh            # registers it (testing/git/runner.env)
  #   bash testing/git/compose.sh --profile ci-dev up -d --no-deps ci-runner
  # Not an isolation option (Task 16 replaces it): jobs run as the runner user inside this
  # container, with no Docker daemon and no host socket. It sits only on the internal `ci`
  # network, whose one other member is Traefik, so jobs reach Forgejo only through ForwardAuth
  # and never forgejo:3000 (Task 11 note), and nothing else outside.
  ci-runner:
    image: data.forgejo.org/forgejo/runner:13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
    container_name: kb-git-ci-runner
    profiles: ["ci-dev"]
    restart: unless-stopped
    depends_on:
      - traefik
    env_file:
      - path: ./git/runner.env
        required: true
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/sh", "/etc/runner/one-job.sh"]
    read_only: true
    tmpfs:
      - /home/runner:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000
    environment:
      HOME: /home/runner
    volumes:
      - ./git/runner/one-job.sh:/etc/runner/one-job.sh:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [ci]

  # Registry allowlist proxy for the isolation-option runners (Task 16, ruling F15): tinyproxy,
  # default deny, CONNECT to npm, Packagist, crates.io and Docker Hub only. No published port
  # (F14): the runner VMs reach it through a QEMU guestfwd that connects to this container's
  # address (testing/git/runners/vm.sh). It is the one service job code talks to, so it sits alone
  # on its own egress-only network, never beside Forgejo, the broker, Kanboard or the databases.
  # Profile ci keeps it out of a plain `up`; up.sh starts it:
  #   bash testing/git/compose.sh --profile ci up -d --no-deps --build ci-proxy
  ci-proxy:
    build: ./git/proxy
    image: kb-git-ci-proxy:dev
    container_name: kb-git-ci-proxy
    profiles: ["ci"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [ci-egress]

  # Authentik 2026.8: server + worker on their own Postgres. No Redis since 2025.10. No ports;
  # reached only through Traefik. The worker gets no docker socket (no managed outposts).
  authentik-db:
    image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    container_name: kb-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-dev-only
    volumes:
      - kb-auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 3s
      retries: 20

  authentik-server: &authentik
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    container_name: kb-auth-server
    command: server
    restart: unless-stopped
    shm_size: 512mb
    depends_on:
      authentik-db:
        condition: service_healthy
    env_file:
      # AUTHENTIK_SECRET_KEY, AUTHENTIK_BOOTSTRAP_PASSWORD/_TOKEN, the two OIDC client secrets.
      - path: ./git/authentik.env
        required: false
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev-only
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_AVATARS: initials
    volumes:
      - ./git/authentik/blueprints:/blueprints/custom:ro

  authentik-worker:
    <<: *authentik
    container_name: kb-auth-worker
    command: worker

networks:
  # Internal: no route out. Members: Traefik and the dev runner.
  ci:
    name: kb-git-ci
    internal: true
  # Not internal (the proxy fetches from the registries). Its only member is ci-proxy.
  ci-egress:
    name: kb-git-ci-egress

volumes:
  kb-auth-db-data:
  kb-git-broker-data:
  kb-git-db-data:
  kb-git-forgejo-data:
  kb-git-broker-it-registry:
  kb-git-broker-it-target:
