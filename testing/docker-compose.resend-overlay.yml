# Mounts the Resend mail-transport plugin (its own repo, gitignored here) into the suite harness.
# RESEND_API_URL points the transport at a mock for live checks; it reaches PHP through
# git/php-fpm-env.conf (php-fpm passes only whitelisted variables). Add it to the compose set
# already in use (see docker inspect kb-suite for the current set), e.g.:
#   docker compose -f testing/docker-compose.dev.yml ... -f testing/docker-compose.resend-overlay.yml up -d --no-deps kanboard
services:
  kanboard:
    environment:
      RESEND_API_URL: ${RESEND_API_URL:-}
    volumes:
      - ../Resend:/var/www/app/plugins/Resend
